name: Dex CI
# Push runs cover main (and release automation); PRs get exactly ONE run via
# the pull_request event instead of the former duplicated push+PR pair.
on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Merge queue: CI validates the QUEUED BATCH exactly as it will land on main,
  # then everything in the batch merges together on one green run.
  merge_group:
# A superseded push to the same PULL REQUEST cancels its stale in-flight run.
# Nothing else is ever cancelled.
#
# The grouping carries that rule, rather than a boolean expression deciding it. A
# pull request groups by its number, so its own later pushes supersede it. Every
# other run — main, beta, tags, the merge queue — groups by its unique run id, so it
# shares a group with nothing and cannot be cancelled by anything.
#
# This was previously expressed as `cancel-in-progress: ${{ github.event_name ==
# 'pull_request' }}` over a group keyed on `github.ref`, which meant every push to
# main shared one group. Observed on 2026-08-12: 10 of the last 15 main runs ended
# `cancelled`, each at the exact second the next merge created its run, with no jobs
# ever scheduled. That matters well beyond wasted minutes — `build-release` only runs
# on main, so a main run cancelled by a later merge is a release whose download files
# are never built. Draft-first publishing makes that state safe (the release stays a
# hidden draft and the prober flags it) but safe is not the same as shipped.
#
# Serialising the actual release work does not depend on this: the `build-release`
# job holds the `stable-public-route` concurrency lock with `cancel-in-progress:
# false`, so concurrent main runs still queue behind each other for publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # Gates, JS suites, lint, and static checks. The Python test suite runs in the
  # sharded `tests` matrix below; its thresholds are enforced by `test-results`.
  quality:
    runs-on: macos-latest
    env:
      VAULT_PATH: core/tests/fixtures/vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "mcp>=1.0.0,<2.0.0" pyyaml python-dateutil requests
      - run: npm ci
      - name: Ensure policy scripts are executable
        run: chmod +x scripts/check-*.sh scripts/check-coverage-threshold.py scripts/check-path-contract-usage.sh scripts/security-gate.sh scripts/benchmark_large_vault.py
      - name: Governance docs present
        run: |
          test -f docs/testing-governance.md || { echo "Missing required governance document docs/testing-governance.md"; exit 1; }
      - name: Hook harness tests
        run: npm run test:hooks
      - name: Script library tests
        env:
          # dex-python.cjs requires an ABSOLUTE interpreter path (rejects bare
          # names like `python3`); setup-python's python-path output is absolute
          # and the `pip install pyyaml` step above targets that same interpreter.
          DEX_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: npm run test:scripts
      - name: Connection-manager engine tests
        run: npm run test:integrations
      - name: Diff-aware test gate
        if: github.event_name == 'pull_request'
        run: bash scripts/check-test-delta.sh
      - name: PII and personal-config gate
        if: github.event_name == 'pull_request'
        run: bash scripts/check-pii.sh
      - name: Path-contract usage gate
        if: github.event_name == 'pull_request'
        run: bash scripts/check-path-contract-usage.sh
      - name: Documentation drift gate
        if: github.event_name == 'pull_request'
        run: bash scripts/check-doc-drift.sh
      - name: Release-tag uniqueness gate
        run: bash scripts/check-release-tag-uniqueness.sh
      - name: Old-version release-tag reachability gate
        run: bash scripts/check-release-tag-reachability.sh
      - name: Architecture inventory drift gate
        run: bash scripts/check-architecture-inventory.sh
      - name: Health promise register gate
        # Every shipped background job must declare a success receipt in
        # core/health/promises.py, or health checks can only measure activity.
        run: python scripts/generate-health-promises.py --check
      - name: Instructed-tool existence gate
        run: python scripts/check-instructed-tools.py
      - name: Shipped-seed tracking gate
        # A starter page Dex ships can silently stop shipping — the file is
        # covered by .gitignore, so dropping it from the index looks like
        # nothing. A user who had written real work into that page then finds
        # their update refusing to run. This gate fails the build instead.
        run: python scripts/check-tracked-ignored.py
      - name: Create vault directories
        run: python -c "from core import paths; from pathlib import Path; [getattr(paths, n).mkdir(parents=True, exist_ok=True) for n in dir(paths) if n.endswith('_DIR') and isinstance(getattr(paths, n), Path)]"
      - name: Generate paths.json
        run: python core/paths.py
      - name: Ruff linting (fail fast)
        run: ruff check core/
      - name: Large-vault performance budget
        run: python scripts/benchmark_large_vault.py --files 1500 --budget-seconds 5.0
      - name: Security gate
        run: bash scripts/security-gate.sh
      - name: Portable-vault contract gate
        run: bash scripts/check-portable-contract.sh
      - name: Connections contract and vendoring manifest gate
        run: npm run check:connections-contract
      - name: Founder-content gate
        run: bash scripts/check-founder-content.sh
      - name: Distribution safety check
        run: bash scripts/verify-distribution.sh
      - name: Path consistency check
        run: bash scripts/check-path-consistency.sh

  # Full Dex Everywhere ships only when the same relocatable runtime completes
  # real MCP and hook round trips on both release operating systems. Linux is
  # deliberately absent from this matrix and remains marked deferred in the
  # versioned harness registry.
  portable-plugin-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned artifact tooling
        run: npm ci --ignore-scripts
      - name: Build and validate installable harness artifacts
        run: python scripts/build-portable-harness-artifacts.py --output-dir build/portable-artifacts
      - name: Verify portable plugin runtime and release boundary
        env:
          DEX_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          python scripts/verify-portable-plugin-runtime.py --require-release-ready
          python scripts/verify-portable-plugin-runtime.py --require-release-ready --plugin-root build/portable-artifacts/dex-gemini-extension
          python scripts/verify-portable-plugin-runtime.py --require-release-ready --plugin-root build/portable-artifacts/dex-claude-desktop --skip-hooks

  # The Python suite, dealt across three runners by recorded test durations
  # (.ci/test-durations.json, regenerated from CI's own junit output when balance
  # drifts). Within each runner, pytest-xdist spreads tests across cores and
  # --dist loadgroup keeps the xdist_group("serial_sensitive") tests on one worker
  # (they share release-build git state; grouping serializes them against EACH
  # OTHER only — load-sensitive tests carry generous margins in their own
  # assertions). Cross-runner isolation is inherent: separate checkouts.
  # Coverage thresholds are NOT enforced per shard — a shard only sees a third of
  # the suite, so per-shard totals are meaningless; test-results combines the
  # shards and enforces every coverage gate on the whole.
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    env:
      VAULT_PATH: core/tests/fixtures/vault
      COVERAGE_FILE: coverage-shard-${{ matrix.shard }}.data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "mcp>=1.0.0,<2.0.0" pyyaml python-dateutil requests
      - run: npm ci
      - name: Create vault directories
        run: python -c "from core import paths; from pathlib import Path; [getattr(paths, n).mkdir(parents=True, exist_ok=True) for n in dir(paths) if n.endswith('_DIR') and isinstance(getattr(paths, n), Path)]"
      - name: Generate paths.json
        run: python core/paths.py
      - name: Test shard ${{ matrix.shard }} of 3
        run: |
          echo "Runner cores: $(sysctl -n hw.ncpu)"
          pytest core/tests/ core/mcp/tests/ core/migrations/tests/ -v -m "not fuzz" \
            --splits 3 --group ${{ matrix.shard }} --durations-path .ci/test-durations.json \
            --splitting-algorithm least_duration \
            -n auto --dist loadgroup \
            --junitxml=.logs/pytest-report-shard-${{ matrix.shard }}.xml \
            --cov=core
      # Backstop for the conftest sessionfinish check: that check fires on the xdist
      # controller today (verified empirically), but it rides on unpinned pytest/xdist
      # hook internals. This shell gate cannot be version-drifted away.
      - name: Fixture-vault mutation gate
        run: |
          if [ -n "$(git status --porcelain -- core/tests/fixtures/vault)" ]; then
            echo "Tracked fixture vault was mutated by the test run:" >&2
            git status --porcelain -- core/tests/fixtures/vault >&2
            exit 1
          fi
      - name: Upload shard results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-shard-${{ matrix.shard }}
          path: |
            coverage-shard-${{ matrix.shard }}.data
            .logs/pytest-report-shard-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Recombines the three shards and enforces the whole-suite gates: total
  # coverage threshold, touched-file coverage threshold, and the merged junit
  # report that feeds release health. This is the single required verdict for
  # "the Python suite passed" — branch protection and the release builds depend
  # on this job, so a missing or failed shard can never slip through.
  test-results:
    needs: tests
    # !cancelled() makes this job RUN (and fail via the guard below) when a shard
    # fails, instead of being skipped. That matters because GitHub treats a
    # SKIPPED required check as satisfied — without this, a red shard would leave
    # the required test-results context green-by-absence and the PR mergeable.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      VAULT_PATH: core/tests/fixtures/vault
      COVERAGE_MIN_TOTAL: "25"
      COVERAGE_MIN_TOUCHED: "10"
    steps:
      - name: Require every shard green
        run: |
          [ "${{ needs.tests.result }}" = "success" ] || { echo "Shard matrix result: ${{ needs.tests.result }} — failing the suite verdict." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "mcp>=1.0.0,<2.0.0" pyyaml python-dateutil requests
      - name: Download shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: test-shard-*
          merge-multiple: true
      - name: Combine coverage and enforce total threshold
        run: |
          # A present-but-corrupt shard file only WARNS in `coverage combine`; the
          # count assertion turns a partially-combined total into a hard failure.
          coverage combine --keep coverage-shard-1.data coverage-shard-2.data coverage-shard-3.data 2>&1 | tee combine.log
          COMBINED=$(grep -oE '^Combined [0-9]+ files?' combine.log | grep -oE '[0-9]+' || true)
          PER_FILE=$(grep -c '^Combined data file' combine.log || true)
          [ "$COMBINED" = "3" ] || [ "$PER_FILE" = "3" ] || { echo "Expected 3 combined shard data files (saw: $(cat combine.log))." >&2; exit 1; }
          coverage json -o coverage.json
          coverage report --fail-under="${COVERAGE_MIN_TOTAL}"
      - name: Touched-file coverage gate
        if: github.event_name == 'pull_request'
        run: python scripts/check-coverage-threshold.py
      - name: Merge junit reports
        run: python scripts/merge-junit.py .logs/pytest-report-shard-1.xml .logs/pytest-report-shard-2.xml .logs/pytest-report-shard-3.xml --output .logs/pytest-report.xml
      # The one invariant that retires every silent-drop class at once (mismatched
      # --splits vs matrix size, a shard collecting fewer tests, an empty shard
      # report): the union of what the shards RAN must equal what a fresh
      # collection of this commit FINDS. Any mismatch is a red gate, not a warning.
      - name: Shard-completeness invariant
        run: |
          python -c "from core import paths; from pathlib import Path; [getattr(paths, n).mkdir(parents=True, exist_ok=True) for n in dir(paths) if n.endswith('_DIR') and isinstance(getattr(paths, n), Path)]"
          COLLECTED=$(pytest core/tests/ core/mcp/tests/ core/migrations/tests/ -m "not fuzz" --collect-only -q | grep -c "::")
          MERGED=$(python -c "import xml.etree.ElementTree as ET; print(sum(int(s.get('tests', 0)) for s in ET.parse('.logs/pytest-report.xml').getroot().iter('testsuite')))")
          echo "collected=$COLLECTED merged=$MERGED"
          [ "$COLLECTED" = "$MERGED" ] || { echo "Shards ran $MERGED tests but this commit collects $COLLECTED — tests were dropped or duplicated." >&2; exit 1; }
      - name: Upload release health inputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-health-inputs
          path: |
            .logs/pytest-report.xml
            coverage.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pr-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Render plain-English PR report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT_FILE: ${{ runner.temp }}/dex-pr-report.md
          CHANGED_FILES: ${{ runner.temp }}/dex-pr-files.txt
        run: |
          git diff --name-only --diff-filter=ACMRD "$BASE_SHA...HEAD" > "$CHANGED_FILES"
          python3 scripts/pr_report.py --files-from "$CHANGED_FILES" > "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
      # pull_request tokens from forks can be read-only. The report is already in
      # the job summary, so a denied comment write is informative, never a CI failure.
      - name: Upsert sticky PR comment when token permissions allow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_FILE: ${{ runner.temp }}/dex-pr-report.md
        run: |
          if COMMENT_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- dex-pr-report -->"))) | .id' | head -n 1)"; then
            if [ -n "$COMMENT_ID" ]; then
              if gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --field body=@"$REPORT_FILE" >/dev/null; then
                echo "Updated the sticky PR report comment."
              else
                echo "::warning::The token cannot update PR comments (common for forks); use the job summary report."
              fi
            elif gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --field body=@"$REPORT_FILE" >/dev/null; then
              echo "Created the sticky PR report comment."
            else
              echo "::warning::The token cannot create PR comments (common for forks); use the job summary report."
            fi
          else
            echo "::warning::The token cannot read PR comments (common for forks); use the job summary report."
          fi

  lens-catalog-release-dry-run:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether the Lens catalogue release path changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CHANGED_FILES="$RUNNER_TEMP/lens-catalog-changed-files.txt"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee "$CHANGED_FILES"
          else
            : > "$CHANGED_FILES"
          fi
          DECISION="$(
            python3 scripts/lens-catalog-release-path.py \
              --event-name "$GITHUB_EVENT_NAME" \
              --changed-files "$CHANGED_FILES"
          )"
          echo "$DECISION" >> "$GITHUB_OUTPUT"
          if [ "$DECISION" = "should_run=false" ]; then
            echo "No Lens catalogue release-path changes; dry-run skipped."
          fi
      - name: Dry-run the Lens catalogue release environment
        if: steps.changes.outputs.should_run == 'true'
        run: |
          OUTPUT_DIR="$RUNNER_TEMP/dex-lens-catalog-dry-run"
          python3 -m venv .lens-venv
          .lens-venv/bin/python -m pip install --quiet 'cryptography>=42' jsonschema
          .lens-venv/bin/python scripts/generate-dex-lens-catalog.py \
            --release-root "$PWD" \
            --output-dir "$OUTPUT_DIR"
          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test -f "$OUTPUT_DIR/dex-lens-catalog-v$VERSION.json"
          test -f "$OUTPUT_DIR/dex-lens-catalog-v$VERSION.json.sha256"
          test -f "$OUTPUT_DIR/dex-lens-catalog-latest.json"
          test -f "$OUTPUT_DIR/dex-lens-catalog-latest.json.sha256"

  build-release:
    needs: [quality, test-results]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    concurrency:
      group: stable-public-route
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.release_guard.outputs.release_sha || steps.release_build.outputs.release_sha }}
      already_published: ${{ steps.release_guard.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A second artifact for one version makes every update check ambiguous,
      # while --clobber silently replaces the already-released bundle.
      - name: Check whether this version is already published
        id: release_guard
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          PUBLISHED_TAGS="$(git ls-remote --tags origin "refs/tags/dist/release/v${VERSION}-*")"
          if [ -n "$PUBLISHED_TAGS" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            # Historical versions may have multiple immutable tags. Choose the
            # lexicographically first tag name so health reporting stays stable
            # on every merge; the uniqueness gate prevents this for new versions.
            PUBLISHED_TAG="$(
              printf '%s\n' "$PUBLISHED_TAGS" |
                awk '$2 !~ /\^\{\}$/ { print $2 }' |
                LC_ALL=C sort |
                sed -n '1p'
            )"
            PEELED_REF="${PUBLISHED_TAG}^{}"
            RELEASE_SHA="$(
              printf '%s\n' "$PUBLISHED_TAGS" |
                awk -v peeled_ref="$PEELED_REF" '$2 == peeled_ref { print $1 }'
            )"
            if [ -z "$RELEASE_SHA" ]; then
              echo "Unable to resolve the published release commit from $PEELED_REF." >&2
              exit 1
            fi
            echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
            echo "Version v$VERSION is already published; publishing runs only when package.json is bumped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      # This job builds from whatever main HEAD is when it runs, but labels the
      # result with package.json's version. If the run at the release commit
      # never reaches the build — one flaky test is enough — a later run builds
      # a newer tree under the old version. The read-back check downstream
      # cannot see it: it compares attached against built, and both sides are
      # the same wrong tree.
      - name: Refuse to label a different tree as this version
        if: steps.release_guard.outputs.already_published == 'false'
        run: bash scripts/check-release-tree-matches-tag.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build release branch
        id: release_build
        if: steps.release_guard.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          bash scripts/build-release.sh
          echo "release_sha=$(git rev-parse release)" >> "$GITHUB_OUTPUT"
          RELEASE_TAG="$(python3 scripts/check-release-catalog-tag-identity.py --release-ref release --print-release-tag)"
          test -n "$RELEASE_TAG"
          python3 scripts/check-release-catalog-tag-identity.py --release-ref release
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build self-contained vault bundle
        if: steps.release_guard.outputs.already_published != 'true'
        run: bash scripts/build-vault-bundle.sh
      - name: Generate signed Dex Lens catalog
        if: steps.release_guard.outputs.already_published != 'true' && vars.DEX_LENS_CATALOG_RELEASE_GATE_ENABLED == 'true'
        env:
          # Front Desk release review and Lens M1 verifier confirmation are required before
          # setting DEX_LENS_CATALOG_RELEASE_GATE_ENABLED=true for a live release.
          # The value must be a base64-encoded Ed25519 PEM private key stored as an
          # environment secret; no generated private key belongs in the repo.
          DEX_LENS_CATALOG_ED25519_PRIVATE_KEY_B64: ${{ secrets.DEX_LENS_CATALOG_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # build-release never runs actions/setup-python, so `python3` here is the
          # runner's Homebrew interpreter and PEP 668 refuses a system-wide install:
          # `pip install cryptography` died with externally-managed-environment and
          # took the whole release with it. An isolated venv keeps the install off the
          # system interpreter without --break-system-packages (which Homebrew warns
          # can break the runner) and without changing `python3` for any other step.
          # jsonschema is installed too: the producer imports it at module scope, so
          # a venv holding only cryptography would fail on the very next line.
          python3 -m venv .lens-venv
          .lens-venv/bin/python -m pip install --quiet 'cryptography>=42' jsonschema
          .lens-venv/bin/python scripts/generate-dex-lens-catalog.py \
            --release-root "$PWD" \
            --output-dir dist \
            --sign \
            --key-id dex-core-lens-1
      - name: Upload Dex Lens catalog for Pages
        if: steps.release_guard.outputs.already_published != 'true' && vars.DEX_LENS_CATALOG_RELEASE_GATE_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dex-lens-catalog-pages
          path: |
            dist/dex-lens-catalog-latest.json
            dist/dex-lens-catalog-latest.json.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Push release branch and immutable tag
        if: steps.release_guard.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          git push origin release --force
          git push origin "${{ steps.release_build.outputs.release_tag }}"
          python3 scripts/check-release-catalog-tag-identity.py --release-ref release --remote origin
      # The ONLY step that makes a stable release public, and it does so last:
      # attach every asset, read each one back off the release and compare it to
      # what was built, and only then flip the draft public. A failure anywhere here
      # leaves the release a hidden draft rather than a public empty page — see the
      # header comment in .github/workflows/release.yml.
      #
      # The Dex Lens catalogue rides along as an extra asset rather than being
      # uploaded afterwards, so nothing can ever appear on a release that is
      # already live.
      - name: Attach assets, verify them, then make the release public
        if: steps.release_guard.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LENS_CATALOG_ENABLED: ${{ vars.DEX_LENS_CATALOG_RELEASE_GATE_ENABLED }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXTRA=()
          if [ "$LENS_CATALOG_ENABLED" = "true" ]; then
            EXTRA+=(--extra-asset "dist/dex-lens-catalog-v$VERSION.json")
            EXTRA+=(--extra-asset "dist/dex-lens-catalog-v$VERSION.json.sha256")
          fi
          python3 scripts/release_publish.py publish \
            --version "$VERSION" \
            --channel stable \
            --dist dist \
            --target "$GITHUB_SHA" \
            "${EXTRA[@]}"

  build-release-beta:
    needs: [quality, test-results]
    if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Build beta release branch
        id: release_build
        run: |
          set -euo pipefail
          bash scripts/build-release.sh --source beta --target release-beta
          RELEASE_TAG="$(python3 scripts/check-release-catalog-tag-identity.py --release-ref release-beta --source-ref beta --print-release-tag)"
          test -n "$RELEASE_TAG"
          IDENTITY="$(python3 scripts/check-release-catalog-tag-identity.py --release-ref release-beta --source-ref beta)"
          test -n "$IDENTITY"
          printf '%s\n' "$IDENTITY"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Push beta release branch and immutable tag
        run: |
          set -euo pipefail
          git push origin release-beta --force
          git push origin "${{ steps.release_build.outputs.release_tag }}"
      - name: Build self-contained vault bundle
        run: bash scripts/build-vault-bundle.sh
      # Same draft-first path as the stable lane, staying marked as a prerelease
      # when it goes live. Both of this lane's long-standing safety guards now live
      # in scripts/release_publish.py, where they are unit-tested rather than only
      # read: it refuses a version that is not X.Y.Z-<pre> (so the beta branch can
      # never publish over a stable release), and refuses to touch an existing
      # release that is not already a prerelease (so it can never clobber a
      # promoted one).
      - name: Attach beta assets, verify them, then publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          python3 scripts/release_publish.py publish \
            --version "$VERSION" \
            --channel beta \
            --dist dist \
            --target "$GITHUB_SHA"

  deploy-health:
    needs: [quality, build-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.quality.result == 'success' && needs['build-release'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download release health inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-health-inputs
          path: .
      - name: Download Dex Lens latest catalog
        if: needs['build-release'].outputs.already_published != 'true' && vars.DEX_LENS_CATALOG_RELEASE_GATE_ENABLED == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dex-lens-catalog-pages
          path: dex-lens-catalog-pages
      - name: Build release health page
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs['build-release'].outputs.release_sha }}
        run: |
          mkdir -p public
          python scripts/build-health-json.py \
            --source-sha "$SOURCE_SHA" \
            --release-sha "$RELEASE_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --quality-conclusion success \
            --output health.json
          python scripts/render-health-page.py --input health.json --output public/health.html
          if [ -f dex-lens-catalog-pages/dex-lens-catalog-latest.json ]; then
            cp dex-lens-catalog-pages/dex-lens-catalog-latest.json public/dex-lens-catalog-latest.json
            cp dex-lens-catalog-pages/dex-lens-catalog-latest.json.sha256 public/dex-lens-catalog-latest.json.sha256
          fi
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Explain Pages setup skip
        if: steps.pages.outcome != 'success'
        run: echo "::notice::Health page not deployed because GitHub Pages is not enabled. Enable Settings → Pages → GitHub Actions."
      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: public
      - name: Deploy health page
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
