# Hashed Python requirements for the installer.
#
# Separate from Dex CI. Do not add these jobs to branch protection,
# merge-queue required checks, or build-release `needs`. Required Dex CI
# names stay untouched: quality, tests, portable-plugin-platforms.

name: Hashed Python requirements

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hashed-python-requirements-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hash-file-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: Regenerate hash file and fail on drift
        run: |
          set -euo pipefail
          uv pip compile --universal --generate-hashes --output-file=core/mcp/requirements.hash.txt core/mcp/requirements.txt
          git diff --exit-code -- core/mcp/requirements.hash.txt

  hashed-pip-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hashed requirements in a fresh venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hash-venv"
          if [ -x "$RUNNER_TEMP/hash-venv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/hash-venv/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/hash-venv/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --require-hashes -r core/mcp/requirements.hash.txt
