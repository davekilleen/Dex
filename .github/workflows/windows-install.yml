# Native Windows install journey + engine CI.
#
# This job is a real signal on the PR (it is allowed to go red). It is still
# a separate workflow, so a red run cannot cancel Dex CI or block a main
# release build. Do NOT add `windows-install-journey` to branch protection,
# merge-queue required checks, or build-release `needs`.
#
# Why a separate workflow, not a job in ci.yml:
# - Required Dex CI names stay untouched: quality, tests, portable-plugin-platforms.
# - A red Windows run cannot cancel or block a main release build.
# - Its own concurrency group cannot starve Dex CI's macos and windows-latest
#   portable-plugin runners.
#
# Existing Windows coverage (do not confuse with this job):
# - `portable-plugin-platforms` in Dex CI already uses windows-latest, but only
#   for portable harness artifact build + runtime verify — not install.sh,
#   not install.ps1, and not the transaction/lifecycle suites.

name: Windows install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs share a group so a later push cancels the stale Windows runner.
# Every other run (main, dispatch) groups by run id and cannot cancel
# another run — the same idiom as Dex CI, never github.ref.
concurrency:
  group: windows-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-install-journey:
    # Real signal: a red job means a Windows install leg failed.
    # Still a separate workflow, so this cannot cancel Dex CI.
    continue-on-error: false
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VAULT_PATH: core/tests/fixtures/vault
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Official python.org Windows builds, same family Joe used — not the
      # Microsoft Store stub and not conda.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python-312
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Python test dependencies
        # Bounded set only: requirements-dev.txt pulls apple-mail-mcp, a macOS
        # seam that does not belong on this runner and would waste minutes.
        run: |
          pip install pytest pyyaml python-dateutil requests "mcp>=1.0.0,<2.0.0"

      - name: Diagnose Git Bash Python layout
        # GHA Git Bash often reports OSTYPE=cygwin (Joe's flavour). Print it.
        shell: bash
        run: |
          set -euo pipefail
          echo "OSTYPE=${OSTYPE:-unset}"
          echo "python=$(command -v python || echo missing)"
          echo "python3=$(command -v python3 || echo missing)"
          python --version
          python3 --version || echo "python3 --version failed (expected on some Windows layouts)"
          echo "setup-python=${{ steps.setup-python-312.outputs.python-path }}"
          git --version
          node --version

      - name: Transaction engine and lifecycle tests (Python 3.12)
        id: engine-312
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m pytest \
            core/tests/test_transaction_core.py \
            core/tests/test_adoption_transaction.py \
            core/tests/test_provision_transaction.py \
            core/tests/test_lifecycle_bridge.py \
            core/tests/test_lifecycle_official_capabilities.py \
            core/tests/test_lifecycle_relocated_vault.py \
            core/tests/test_lifecycle_service_contract.py \
            core/tests/test_lifecycle_topology_migration.py \
            core/tests/test_windows_binary_credential_trust_writes.py \
            -m "not fuzz" -q --tb=line

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python-313
        with:
          python-version: '3.13'

      - name: Transaction engine and lifecycle tests (Python 3.13)
        id: engine-313
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          pip install pytest pyyaml python-dateutil requests "mcp>=1.0.0,<2.0.0"
          python -m pytest \
            core/tests/test_transaction_core.py \
            core/tests/test_adoption_transaction.py \
            core/tests/test_provision_transaction.py \
            core/tests/test_lifecycle_bridge.py \
            core/tests/test_lifecycle_official_capabilities.py \
            core/tests/test_lifecycle_relocated_vault.py \
            core/tests/test_lifecycle_service_contract.py \
            core/tests/test_lifecycle_topology_migration.py \
            -m "not fuzz" -q --tb=line

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: install.sh Git Bash OSTYPE=cygwin with Store python3 stub
        id: install-cygwin
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash scripts/run-windows-install-journey.sh install-cygwin-stub

      - name: install.sh Git Bash OSTYPE=msys then activate/adopt/rewind
        id: install-msys
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash scripts/run-windows-install-journey.sh install-msys-journey

      - name: install.ps1 in PowerShell
        id: install-ps1
        continue-on-error: true
        shell: bash
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash scripts/run-windows-install-journey.sh install-ps1-negative

      - name: beginner helper contract
        id: beginner-helpers
        continue-on-error: true
        shell: bash
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash scripts/run-windows-install-journey.sh beginner-helpers

      - name: Windows install verdict
        if: always()
        shell: bash
        env:
          ENGINE312: ${{ steps.engine-312.outcome }}
          ENGINE313: ${{ steps.engine-313.outcome }}
          INSTALL_CYGWIN: ${{ steps.install-cygwin.outcome }}
          INSTALL_MSYS: ${{ steps.install-msys.outcome }}
          INSTALL_PS1: ${{ steps.install-ps1.outcome }}
          BEGINNER_HELPERS: ${{ steps.beginner-helpers.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Windows install journey"
            echo
            echo "This job is a real signal. It is still **not** a required merge-gate name (quality / tests / portable-plugin-platforms)."
            echo
            echo "| Leg | Outcome |"
            echo "| --- | --- |"
            echo "| Engine tests 3.12 | ${ENGINE312} |"
            echo "| Engine tests 3.13 | ${ENGINE313} |"
            echo "| install.sh OSTYPE=cygwin + Store stub | ${INSTALL_CYGWIN} |"
            echo "| install.sh OSTYPE=msys + activate/adopt/rewind/CRLF | ${INSTALL_MSYS} |"
            echo "| install.ps1 (PowerShell, provenance refusal) | ${INSTALL_PS1} |"
            echo "| beginner helper contract | ${BEGINNER_HELPERS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "engine312=${ENGINE312} engine313=${ENGINE313} cygwin=${INSTALL_CYGWIN} msys=${INSTALL_MSYS} ps1=${INSTALL_PS1} beginner=${BEGINNER_HELPERS}"
          if [ "$ENGINE312" != "success" ] || [ "$ENGINE313" != "success" ] \
            || [ "$INSTALL_CYGWIN" != "success" ] || [ "$INSTALL_MSYS" != "success" ] \
            || [ "$INSTALL_PS1" != "success" ] || [ "$BEGINNER_HELPERS" != "success" ]; then
            echo "One or more Windows legs failed." >&2
            exit 1
          fi
